name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check JavaScript syntax
        shell: bash
        run: find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check frontend architecture
        run: npm run check:architecture

      - name: Check service-worker update lifecycle
        run: node scripts/check-service-worker-updates.js

      - name: Check immutable deployment assets
        run: npm run check:deployment-assets

      - name: Check frontend update flow and release stamping
        run: npm run check:app-update-flow

      - name: Check Conventional Commit SemVer versioning
        run: npm run check:semver-version

      - name: Check question answer UX
        run: npm run check:question-answer-ux

      - name: Check runtime reliability
        run: npm run check:runtime

      - name: Check state-save concurrency
        run: npm run check:state-save

      - name: Check deck-clear concurrency
        run: npm run check:deck-clear

      - name: Check sync timestamp recovery
        run: npm run check:sync-timestamp

  deploy:
    needs: security
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve semantic release version
        id: release
        run: node scripts/resolve-semver-version.js

      - name: Stamp release version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          DISPLAY_VERSION: ${{ steps.release.outputs.display_version }}
        run: node scripts/stamp-release-version.js

      - name: Check stamped JavaScript syntax
        run: node --check app-entry.js && node --check sw.js

      - name: Preserve QR vendor assets for cached app versions
        run: cp -R qr-vendor "$RUNNER_TEMP/qr-vendor-original"

      - name: Minify files
        uses: dra1ex/minify-action@v1.0.3

      - name: Restore original QR vendor assets
        run: cp -R "$RUNNER_TEMP/qr-vendor-original/." qr-vendor/

      - name: Verify QR vendor integrity
        run: node scripts/verify-qr-vendor-integrity.js

      - name: Check minified JavaScript syntax
        run: node --check app-entry.js && node --check sw.js

      - name: Verify deployed release version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          DISPLAY_VERSION: ${{ steps.release.outputs.display_version }}
        run: node scripts/verify-release-version.js

      - name: Prepare content-hashed Pages assets
        run: node scripts/prepare-pages-assets.js "$RUNNER_TEMP/mrh-pages"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mrh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Tag semantic release
        if: steps.release.outputs.should_tag == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"
