name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check JavaScript syntax
        shell: bash
        run: find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check frontend architecture
        run: npm run check:architecture

      - name: Check service-worker update lifecycle
        run: node scripts/check-service-worker-updates.js

  deploy:
    needs: security
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp release version
        env:
          RELEASE_VERSION: mrh-${{ github.sha }}
        run: node scripts/stamp-release-version.js

      - name: Check stamped JavaScript syntax
        run: node --check app-entry.js && node --check sw.js

      - name: Minify files
        uses: dra1ex/minify-action@v1.0.3

      - name: Check minified JavaScript syntax
        run: node --check app-entry.js && node --check sw.js

      - name: Verify deployed release version
        env:
          RELEASE_VERSION: mrh-${{ github.sha }}
        run: node scripts/verify-release-version.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
