<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loading Maritime Review Hub</title>
  </head>
  <body>
    <p>Loading Maritime Review Hub...</p>
    <script>
      (async function () {
        "use strict";

        const pathSegments = window.location.pathname
          .split("/")
          .filter(Boolean);
        const candidates = [];

        for (
          let baseLength = pathSegments.length;
          baseLength >= 0;
          baseLength--
        ) {
          const baseSegments = pathSegments.slice(0, baseLength);
          const basePath = `/${baseSegments.join("/")}${baseSegments.length ? "/" : ""}`;
          candidates.push({ baseLength, basePath });
        }

        for (const candidate of candidates) {
          try {
            const candidateUrl = new URL(
              `${candidate.basePath}index.html`,
              window.location.origin,
            );
            candidateUrl.search = window.location.search;
            const response = await fetch(candidateUrl.href, {
              cache: "no-store",
            });
            if (!response.ok) continue;

            const appHtml = await response.text();
            const appHtmlWithBase = appHtml.replace(
              /<head(?:\s[^>]*)?>/i,
              (head) => `${head}<base href="${candidate.basePath}">`,
            );
            if (appHtmlWithBase === appHtml) {
              throw new Error("Application entry point has no head element.");
            }

            document.open();
            document.write(appHtmlWithBase);
            document.close();
            return;
          } catch (error) {
            console.warn("Unable to load application entry point.", error);
          }
        }

        document.body.innerHTML =
          "<p>Unable to load Maritime Review Hub. Please check your connection and try again.</p>";
      })();
    </script>
  </body>
</html>
