<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loading Maritime Review Hub</title>
  </head>
  <body>
    <p>Loading Maritime Review Hub...</p>
    <script>
      (async function () {
        "use strict";

        const pathSegments = window.location.pathname
          .split("/")
          .filter(Boolean);
        const candidates = [];

        for (
          let baseLength = pathSegments.length;
          baseLength >= 0;
          baseLength--
        ) {
          const baseSegments = pathSegments.slice(0, baseLength);
          const basePath = `/${baseSegments.join("/")}${baseSegments.length ? "/" : ""}`;
          candidates.push({ baseLength, basePath });
        }

        for (const candidate of candidates) {
          try {
            const candidateUrl = new URL(
              `${candidate.basePath}index.html`,
              window.location.origin,
            );
            candidateUrl.search = window.location.search;
            const response = await fetch(candidateUrl.href, {
              cache: "no-store",
            });
            if (!response.ok) continue;

            const route = pathSegments
              .slice(candidate.baseLength)
              .map((segment) => {
                try {
                  return encodeURIComponent(
                    decodeURIComponent(segment.replace(/\+/g, " ")),
                  ).replace(/%20/g, "+");
                } catch (error) {
                  return encodeURIComponent(
                    segment.replace(/\+/g, " "),
                  ).replace(/%20/g, "+");
                }
              })
              .join("/");
            const hash = route ? `#/${route}` : "";
            const target = new URL(
              `${candidate.basePath}index.html${hash}`,
              window.location.origin,
            );
            target.search = window.location.search;
            window.location.replace(
              target.pathname + target.search + target.hash,
            );
            return;
          } catch (error) {
            // Try the next possible app base path.
          }
        }

        const fallbackRoute = pathSegments
          .map((segment) =>
            encodeURIComponent(segment.replace(/\+/g, " ")).replace(
              /%20/g,
              "+",
            ),
          )
          .join("/");
        const fallback = new URL("/index.html", window.location.origin);
        fallback.search = window.location.search;
        fallback.hash = fallbackRoute ? `/${fallbackRoute}` : "";
        window.location.replace(
          fallback.pathname + fallback.search + fallback.hash,
        );
      })();
    </script>
  </body>
</html>
