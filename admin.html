<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRH Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { 900: '#1e3a8a', 600: '#2563eb', 500: '#3b82f6' } } } }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col items-center">

    <header class="bg-brand-900 text-white w-full p-4 shadow-md text-center">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-lock mr-2"></i> Admin Portal</h1>
    </header>

    <main class="flex-1 w-full max-w-4xl p-6">
        
        <!-- LOGIN SECTION -->
        <div id="login-section" class="bg-white p-8 rounded-xl shadow-md max-w-md mx-auto mt-12">
            <h2 class="text-2xl font-bold mb-4 text-center">Authentication Required</h2>
            <input type="password" id="admin-password" class="w-full p-3 border rounded-lg mb-4 bg-gray-50" placeholder="Enter Admin Password">
            <button onclick="login()" class="w-full bg-brand-600 text-white py-3 rounded-lg font-bold hover:bg-brand-700 transition">Log In</button>
            <p id="login-error" class="text-red-500 text-sm mt-3 hidden text-center">Incorrect password.</p>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboard-section" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Subject Hierarchy Editor</h2>
                <button onclick="saveChanges()" id="btn-save" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700 transition shadow-md">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> Save Layout
                </button>
            </div>
            
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 rounded-r-lg text-sm text-blue-800">
                <strong>Tip:</strong> Use double colons (<code>::</code>) to create nesting. For example: <code>BSMT::3.1::Prelims::Naval Architecture</code>.
            </div>

            <div id="loading-spinner" class="text-center py-12">
                <i class="fa-solid fa-spinner fa-spin text-4xl text-brand-500 mb-4"></i>
                <p>Loading database subjects...</p>
            </div>

            <div id="subject-list" class="space-y-3 hidden">
                <!-- Dynamically populated via JS -->
            </div>
        </div>

    </main>

    <script>
        // REPLACE WITH YOUR ACTUAL GOOGLE APPS SCRIPT URL
        const SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL";
        let sessionToken = "";
        let currentSubjects = [];

        function login() {
            const pass = document.getElementById('admin-password').value;
            if(!pass) return;
            sessionToken = pass;
            
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            
            fetchSubjects();
        }

        async function fetchSubjects() {
            try {
                // Uses your existing GET route to retrieve summary
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                currentSubjects = data.map(cat => cat.Subject);
                renderSubjectList();
            } catch (err) {
                alert("Error fetching subjects. Check console.");
                console.error(err);
            }
        }

function renderSubjectList() {
            document.getElementById('loading-spinner').classList.add('hidden');
            const container = document.getElementById('subject-list');
            container.classList.remove('hidden');

            container.innerHTML = currentSubjects.map((subj, index) => `
                <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 flex flex-col md:flex-row items-center gap-4">
                    <div class="w-full md:w-1/3">
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">Current Subject Name</span>
                        <div class="font-medium bg-gray-100 p-2 rounded text-gray-700 truncate" title="${subj}" id="old-subj-${index}">${subj}</div>
                    </div>
                    <i class="fa-solid fa-arrow-right text-gray-400 hidden md:block"></i>
                    <i class="fa-solid fa-arrow-down text-gray-400 block md:hidden"></i>
                    <div class="w-full md:w-2/3">
                        <div class="flex justify-between items-end mb-1">
                            <span class="text-xs font-bold text-brand-600 uppercase tracking-wider">New Hierarchy Path</span>
                            <span class="text-xs text-gray-400 font-mono" id="char-count-${index}">${subj.length}/100</span>
                        </div>
                        <input type="text" 
                               id="new-subj-${index}" 
                               value="${subj}" 
                               maxlength="100"
                               oninput="document.getElementById('char-count-${index}').innerText = this.value.length + '/100'; 
                                        this.value.length >= 90 ? document.getElementById('char-count-${index}').classList.add('text-red-500') : document.getElementById('char-count-${index}').classList.remove('text-red-500');"
                               class="w-full p-2 border border-gray-300 rounded focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none transition">
                    </div>
                </div>
            `).join('');
        }

        async function saveChanges() {
            const btn = document.getElementById('btn-save');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            const updates = [];
            currentSubjects.forEach((subj, index) => {
                const newName = document.getElementById(`new-subj-${index}`).value.trim();
                // Only queue it if the name actually changed
                if (newName !== subj && newName !== "") {
                    updates.push({ oldName: subj, newName: newName });
                }
            });

            if (updates.length === 0) {
                alert("No changes detected.");
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i> Save Layout';
                btn.disabled = false;
                return;
            }

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        type: "admin_update",
                        token: sessionToken,
                        updates: updates
                    })
                });

                const result = await response.json();
                
                if (result.status === "success") {
                    alert("Hierarchy Updated! Your Google Sheets have been modified.");
                    fetchSubjects(); // Reload to show the new names
                } else {
                    alert("Failed: " + result.message);
                    if(result.message.includes("Unauthorized")) {
                        // Kick back to login
                        document.getElementById('dashboard-section').classList.add('hidden');
                        document.getElementById('login-section').classList.remove('hidden');
                        document.getElementById('login-error').classList.remove('hidden');
                    }
                }
            } catch(e) {
                alert("Network error.");
                console.error(e);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i> Save Layout';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
